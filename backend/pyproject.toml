[project]
name = "dota2-compendium-analyzer"
version = "0.1.0"
description = "Аналитика Predictions и Fantasy Draft компендиума TI15"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
