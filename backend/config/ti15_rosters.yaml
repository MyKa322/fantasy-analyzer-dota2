# Ручная фиксация составов участников TI15.
#
# Автоматическое определение опирается на последние матчи команды и обычно право,
# но перед самым турниром бывают замены, которых в статистике ещё нет. Всё, что
# указано здесь, имеет приоритет над автоматикой.
#
# Ники — как в OpenDota (поле `name` игрока). Если ник не найден среди тех, кто
# играл за эту команду, разметка не подменяется молча: в лог уходит
# предупреждение, а слот остаётся за автоматикой.
#
# Роли: core (2 игрока), mid (1), support (2).

overrides:
  # SSS ушёл после апреля, с мая играет Noticed — на экране компендиума в
  # core-дуо стоят именно Satanic и Noticed.
  Team Vision:
    core: ["Satanic", "Noticed"]
    mid: ["No[o]ne-"]
    support: ["9Class", "Dukalis"]
