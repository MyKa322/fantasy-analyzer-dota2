# Ручная фиксация составов участников TI15.
#
# Автоматическое определение опирается на последние матчи команды и обычно право,
# но перед самым турниром бывают замены, которых в статистике ещё нет. Всё, что
# указано здесь, имеет приоритет над автоматикой.
#
# Ники — как в OpenDota (поле `name` игрока). Если ник не найден среди тех, кто
# играл за эту команду, разметка не подменяется молча: в лог уходит
# предупреждение, а слот остаётся за автоматикой.
#
# Роли: core (2 игрока), mid (1), support (2).
#
# Игрок со стороны — тот, кто за эту команду ещё не играл, — ником не задаётся:
# ников «Topson» в OpenDota десятки, и резолвить их не по чему. Для такого слот
# пишется словарём:
#
#   mid:
#     - name: "Topson"
#       account_id: 94054712
#       replaces: "TaiLung"
#
# `replaces` — чью историю брать под прогноз. Своих карт у новичка в выборке
# нет, а очки роли сильно заданы тем, как играет команда, поэтому проекция
# считается по картам заменённого игрока. Роль при этом помечается как замена:
# и в API, и на странице видно, что цифры — по слоту, а не по человеку.

overrides:
  # SSS ушёл после апреля, с мая играет Noticed — на экране компендиума в
  # core-дуо стоят именно Satanic и Noticed.
  Team Vision:
    core: ["Satanic", "Noticed"]
    mid: ["No[o]ne-"]
    support: ["9Class", "Dukalis"]

  # Перед самым TI15 на мид вместо TaiLung взяли Topson. Из киберспорта он ушёл
  # в 2024-м: в OpenDota на 10.08.2026 у него 800 матчей за период с 22.05.2024
  # и ни одного с leagueid — только пабы, последний 11.06.2026. Считать по ним
  # проекцию нельзя (другой уровень сопротивления, нет разбора матчей), поэтому
  # прогноз идёт по картам мид-слота LGD.
  LGD Gaming:
    mid:
      - name: "Topson"
        account_id: 94054712
        replaces: "TaiLung"
